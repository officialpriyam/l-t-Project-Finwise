services:
  postgres:
    image: postgres:18-alpine
    container_name: finwise-postgres
    environment:
      POSTGRES_USER: finwise
      POSTGRES_PASSWORD: finwise
      POSTGRES_DB: finwise
    ports:
      # 5432/5433 are commonly taken on developer machines.
      - "5436:5432"
    volumes:
      - finwise_postgres:/var/lib/postgresql
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finwise -d finwise"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  finwise_postgres:
